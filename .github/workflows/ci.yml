name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Cast/go.mod
      - run: go vet ./...
        working-directory: Cast
      - run: go test -race -count=1 ./...
        working-directory: Cast
      - run: go mod tidy -diff
        working-directory: Cast
